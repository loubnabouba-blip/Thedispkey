<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verkeerswijzer BT Amersfoort</title>
<meta name="description" content="Snelle afhandelwijzer art. 8, 9, 163 WvW94 en snelheid in BVH voor Basisteam Amersfoort.">
<meta name="theme-color" content="#0a2f6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
 --bg:#eef2f8;--card:#fff;--ink:#0d1b33;--muted:#55627a;--line:#d8dfeb;
 --navy:#0a2f6b;--acc:#1647c8;--accbg:#e7edff;--gold:#f2b705;
 --red:#b42318;--redbg:#fdeceb;--ok:#0b7a4b;--okbg:#e1f5ea;--warn:#8a5a00;--warnbg:#fff3d1;
 --bvh:#1647c8;--form:#6b2fb3;--fys:#a65a00;--mail:#0b6b8a;
 --r:14px;--sh:0 1px 2px rgba(10,30,70,.08),0 4px 14px rgba(10,30,70,.06);
 --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#0b1220;--card:#131c2e;--ink:#e8eefb;--muted:#9aa8c2;--line:#25324b;
 --navy:#0a1d42;--acc:#7ea2ff;--accbg:#1a2850;--red:#ff8a80;--redbg:#3a1a1a;--ok:#5fd6a0;--okbg:#10301f;--warn:#ffd36b;--warnbg:#33290c;
 --bvh:#7ea2ff;--form:#c3a0ff;--fys:#ffb866;--mail:#6fd3f0;--sh:none}}
:root[data-theme=dark]{
 --bg:#0b1220;--card:#131c2e;--ink:#e8eefb;--muted:#9aa8c2;--line:#25324b;
 --navy:#0a1d42;--acc:#7ea2ff;--accbg:#1a2850;--red:#ff8a80;--redbg:#3a1a1a;--ok:#5fd6a0;--okbg:#10301f;--warn:#ffd36b;--warnbg:#33290c;
 --bvh:#7ea2ff;--form:#c3a0ff;--fys:#ffb866;--mail:#6fd3f0;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);-webkit-text-size-adjust:100%}
a{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0 6px}
.logo{width:34px;height:34px;flex:none}
.brand{flex:1;min-width:0;line-height:1.15}
.brand b{display:block;font-size:17px;letter-spacing:.2px}
.brand span{font-size:12px;opacity:.8}
.ib{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;border-radius:10px;font-size:18px;display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.22)}
.search{position:relative;padding:4px 0 12px}
.search input{width:100%;height:48px;border-radius:12px;border:0;padding:0 44px 0 44px;font:inherit;font-size:17px;background:#fff;color:#0d1b33}
.search svg{position:absolute;left:13px;top:17px;width:20px;height:20px;color:#55627a}
.search .x{position:absolute;right:6px;top:8px;width:36px;height:36px;border:0;background:none;color:#55627a;font-size:20px;display:none}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;color:#fff;text-decoration:none;font-size:14px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.12)}
.nav a[aria-current=page]{background:var(--gold);color:#0d1b33}
main{padding:16px 0 90px;min-height:70vh}
h1{font-size:24px;line-height:1.2;margin:4px 0 6px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.lead{color:var(--muted);margin:0 0 14px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 16px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tile{display:flex;gap:12px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--g,var(--acc));border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;min-height:76px}
.tile:hover{border-color:var(--g,var(--acc))}
.tile .kl{flex:none;min-width:46px;text-align:center;font-weight:800;font-size:13px;letter-spacing:.03em;color:var(--g,var(--acc));background:var(--accbg);border-radius:8px;padding:6px 6px;margin-top:1px}
.opt .chev{font-size:26px;color:var(--muted);line-height:1}
.tile .ic{font-size:26px;line-height:1;flex:none;margin-top:2px}
.tile b{display:block;font-size:16px;line-height:1.25}
.tile small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.chip.red{background:var(--redbg);color:var(--red)}.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:12px;font-weight:600;text-decoration:none;color:var(--ink);min-height:44px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme=dark] .btn.pri,.btn.pri{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{background:#2b55d8;border-color:#2b55d8;color:#fff}}
.hero{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.hero{grid-template-columns:1fr}}
.big{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#1647c8,#0a2f6b);border-radius:var(--r);padding:16px;min-height:96px;box-shadow:var(--sh)}
.big.b2{background:linear-gradient(135deg,#0b7a74,#0a4f5c)}
.big b{font-size:18px}.big span{font-size:13.5px;opacity:.9}
.big .ic{font-size:28px}
.tools{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.tools a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.tools a b{display:block}.tools a small{color:var(--muted)}
/* result list */
#res{display:none}
.hit{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px}
.hit .k{font-weight:800;font-size:12px;background:var(--accbg);color:var(--acc);border-radius:8px;padding:4px 8px;flex:none;min-width:44px;text-align:center}
.hit small{color:var(--muted);display:block;font-size:13px}
mark{background:var(--gold);color:#000;border-radius:3px;padding:0 1px}
/* zaak page */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.crumb a{font-weight:600;text-decoration:none;font-size:14px}
.title{display:flex;gap:12px;align-items:flex-start}
.title .ic{font-size:34px;line-height:1.1}
.facts{display:grid;gap:8px;grid-template-columns:repeat(2,1fr);margin:12px 0}
@media(max-width:480px){.facts{grid-template-columns:1fr}}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact small{display:block;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.fact b{display:block;font-size:18px;line-height:1.25}
.fact.red{background:var(--redbg);border-color:transparent}.fact.red b{color:var(--red)}
.fact.ok{background:var(--okbg);border-color:transparent}.fact.ok b{color:var(--ok)}
.fact.nav2{background:var(--accbg);border-color:transparent}
.codes{display:flex;flex-direction:column;gap:8px}
.code{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.code button{font-weight:800;font-size:18px;letter-spacing:.04em;font-variant-numeric:tabular-nums;background:var(--accbg);color:var(--acc);border:0;border-radius:9px;padding:8px 12px;min-width:84px}
.code button.done{background:var(--okbg);color:var(--ok)}
.code span{font-size:14px}
.alert{border-radius:12px;padding:11px 14px;margin:10px 0;font-size:15px;border:1px solid transparent}
.alert b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.alert.warn{background:var(--warnbg);color:var(--warn);border-color:rgba(138,90,0,.25)}
.alert.red{background:var(--redbg);color:var(--red)}
.alert.info{background:var(--accbg);color:var(--ink)}
.prog{position:sticky;top:var(--hh,138px);z-index:5;background:var(--bg);padding:8px 0}
.prog .t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600}
.prog .b{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.prog .b i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.step{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer;user-select:none}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted)}
.step .n::before{counter-increment:s;content:counter(s)}
.step.on{opacity:.62}
.step.on .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.on .n::before{content:""}
.step.on .tt{text-decoration:line-through}
.step .tt{font-weight:700;line-height:1.3}
.step .d{color:var(--muted);font-size:14.5px;margin-top:3px}
.step.cond{border-style:dashed}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.07em;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px;color:#fff}
.tag.BVH{background:var(--bvh)}.tag.FORM{background:var(--form)}.tag.FYS{background:var(--fys)}.tag.MAIL{background:var(--mail)}.tag.ALS{background:#b42318}
:root[data-theme=dark] .tag,.tag{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tag{color:#0b1220}}
.step .more{display:inline-block;margin-top:6px;font-size:13.5px;font-weight:700;color:var(--acc);background:var(--accbg);border:0;border-radius:8px;padding:5px 10px}
.links{display:flex;flex-direction:column;gap:6px}
.links a{display:flex;justify-content:space-between;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:600}
.links a span{color:var(--acc)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--bg);position:sticky;top:0}
tr.hl td{background:var(--warnbg);font-weight:800}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
/* forms */
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font:inherit}
textarea{height:auto;padding:10px 12px;min-height:90px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{margin:0;font-weight:600}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;min-height:44px}
.seg input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--gold)}
.result{margin-top:14px;border-radius:var(--r);padding:16px;background:var(--accbg)}
.result .v{font-size:34px;font-weight:800;line-height:1.1}
.result.red{background:var(--redbg)}.result.ok{background:var(--okbg)}
.row2{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
/* wizard */
.q{font-size:22px;font-weight:800;line-height:1.25;margin:6px 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-weight:700;font-size:17px;box-shadow:var(--sh);min-height:60px;width:100%}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:14px}
.opt .ic{font-size:24px}
.opt:hover{border-color:var(--acc)}
/* BVH replica */
.bvh{background:#f4f7fb;color:#13203a;border:1px solid #b9c4d8;border-radius:10px;padding:12px;display:grid;grid-template-columns:130px 1fr;gap:8px 10px;font-size:14px;align-items:center}
.bvh .l{color:#33425e}.bvh .f{background:#fff;border:1px solid #9fb0cc;border-radius:3px;padding:4px 8px;min-height:28px}
.bvh .f.h{background:#fff7d6;border-color:#f2b705;box-shadow:0 0 0 2px rgba(242,183,5,.35);font-weight:700}
.bvh .note{grid-column:1/-1;font-size:12.5px;color:#55627a;margin-top:2px}
@media(max-width:480px){.bvh{grid-template-columns:1fr}.bvh .l{margin-bottom:-4px;font-size:12px}}
/* modal */
dialog{border:0;border-radius:18px;padding:0;max-width:640px;width:calc(100% - 24px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(5,12,28,.6)}
dialog .h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:800}
dialog .h button{border:0;background:var(--accbg);color:var(--acc);border-radius:10px;width:40px;height:40px;font-size:18px}
dialog .b{padding:14px 16px 18px;max-height:75vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:#0d1b33;color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-size:14px}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{color:var(--muted);font-size:12.5px;padding:10px 0 40px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.install{display:none}
@media print{header,.nav,.prog,.cta,.toast,footer .no,.crumb,.more{display:none!important}body{background:#fff;color:#000}.step,.fact,.card,.code{break-inside:avoid;box-shadow:none}.step{cursor:default}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hd">
 <div class="wrap">
  <div class="bar">
   <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#0a2f6b" stroke="#fff" stroke-opacity=".25" stroke-width="12"/><path d="M256 84l140 52v108c0 88-58 150-140 184-82-34-140-96-140-184V136z" fill="#f2b705"/><path d="M256 120l106 40v84c0 68-43 117-106 146-63-29-106-78-106-146v-84z" fill="#0a2f6b"/><path d="M206 262l36 36 70-80" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></svg>
   <div class="brand"><b>Verkeerswijzer</b><span>Basisteam Amersfoort · verkeer</span></div>
   <button class="ib" id="theme" aria-label="Donker/licht thema" title="Thema"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/></svg></button>
   <button class="ib" id="share" aria-label="Deel deze pagina" title="Deel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
  </div>
  <div class="search">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
   <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Zoek: 8/2/A · D21 · 12262 · weigeren · geschorst…" aria-label="Zoeken">
   <button class="x" id="qx" aria-label="Wis zoekopdracht"></button>
  </div>
  <nav class="nav" id="nav" aria-label="Hoofdmenu"></nav>
 </div>
</header>
<div class="wrap"><main id="app" aria-live="polite"></main>
<footer>
 <div id="foot"></div>
</footer></div>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ============================ DATA ============================ */
const WVW="BWBR0006622", RVV="BWBR0004825";
const wet=(id,art)=>`https://wetten.overheid.nl/jci1.3:c:${id}&artikel=${art}`;
const WL=(art,lbl)=>({t:lbl||`WvW 1994 · artikel ${art}`,u:wet(WVW,art)});
const RL=(art,lbl)=>({t:lbl||`RVV 1990 · artikel ${art}`,u:wet(RVV,art)});
const BRON="Afhandeling art 8, 9, 163 WvW94 en snelheid in BVH · versie 2.0 · januari 2026";

/* Herbruikbare stappen: t=titel, d=uitleg, k=soort (BVH/FORM/FYS/MAIL/ALS) */
const S={
 incident:(kl,oms)=>({k:"BVH",t:`Nieuw incident met maatschappelijke klasse ${kl}`,d:`${oms}. Een melding ophalen uit GMS kan natuurlijk ook.`}),
 invoer:(extra)=>({k:"BVH",t:"Voer verdachte, voertuig en rijbewijs in",d:"Rijbewijs: registratienummer = rijbewijsnummer · model/type = categorieën · datum afgifte + datum 1e afgifte (oudste datum) · bijzonderheden = gemeente van afgifte."+(extra||""),m:"rb"}),
 voertuig:{k:"BVH",t:"Voer het voertuig in",d:"In deze maatschappelijke klasse."},
 laste:(a,d)=>({k:"BVH",t:`Leg ten laste: artikel ${a}`,d:d||"Gebruik de code hieronder (kopieer met één tik)."}),
 idstaat:{k:"BVH",t:"Maak een ID-staat van het document dat de verdachte bij zich heeft",d:"Liefst het rijbewijs; heeft hij dat niet, dan kan een ander document. De ID-zuil maakt zelf een extra actie met de ID-staat. Een I18 opmaken is niet meer nodig."},
 kopie:{k:"FYS",t:"Kopie van voor- en achterkant van het rijbewijs",d:"Alleen als de verdachte een rijbewijs bij zich heeft."},
 g10:{k:"BVH",t:"Maak actie G10 aan – verdachte krijgt rol ‘verdachte’",d:"Daarna direct naar formulieren en een PV verhoor samenstellen. BVH stelt de vragen zelf: stel je een vraag niet, klik dan op ‘volgende’ en hij komt niet in het verhoor."},
 g10b:{k:"BVH",t:"Maak actie G10 (verhoor verdachte) aan en koppel de verdachte",d:"Formulieren → PV verhoor. Vragen die je niet stelt: ‘volgende’, dan komen ze niet in het verhoor."},
 d30:{k:"BVH",t:"Maak actie D30 aan",d:"Koppel hierin de verdachte, het rijbewijs en het voertuig."},
 pvinv:(x)=>({k:"FORM",t:"Stel het PV (in)vordering rijbewijs samen",d:"Het rijbewijs gaat naar het CVOM als BVH daarom vraagt. BVH verzendt het formulier automatisch; het DIK/RTIC zet daarna een maatregel op het rijbewijs."+(x||"")}),
 kennis:{k:"FORM",t:"Kennisgeving van ontvangst ingevorderd rijbewijs",d:"Samenstellen, tekenen, kopie voor het dossier. Het origineel gaat naar de verdachte."},
 melding:{k:"FORM",t:"Formulier melding invordering rijbewijs",d:"Hierdoor komt er een maatregel op het rijbewijs van de verdachte; je hoeft niets te mailen."},
 i16:{k:"BVH",t:"Maak actie I16 aan en koppel de verdachte"},
 rijverbod:(d)=>({k:"FORM",t:"Formulier rijverbod art. 8 WvW 1994",d,m:"rv"}),
 heen:{k:"FYS",t:"Verdachte heenzenden"},

function toast(m){toastEl.textContent=m;toastEl.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("on"),1800)}
async function copy(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"Gekopieerd: "+t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast(msg||"Gekopieerd: "+t)}catch(_){toast("Kopiëren niet gelukt")}a.remove()}}
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9µ]+/g," ").trim();

/* ============================ ZOEKEN ============================ */
const INDEX=ZAKEN.map(z=>({z,txt:norm([z.titel,z.kort,z.zoek,z.klasse,z.art,z.laste,z.laste.replace(/\//g," "),z.codes.map(c=>c.c+" "+c.l).join(" "),GROEPEN[z.g].n].join(" "))}));
function zoek(q){
 const w=norm(q).split(" ").filter(Boolean);if(!w.length)return[];
 return INDEX.map(({z,txt})=>{let s=0;for(const t of w){if(!txt.includes(t)){s=-1;break}s+=txt.split(" ").includes(t)?3:1;if(norm(z.titel).includes(t))s+=2}return{z,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.z);
}
const hl=(t,q)=>{const w=norm(q).split(" ").filter(Boolean);let o=esc(t);for(const x of w){if(x.length<2)continue;o=o.replace(new RegExp("("+x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>")}return o};

/* ---------- wizard ---------- */
function vWizard(node,hist){
 node=node||"start";hist=hist||[];
 const n=WZ[node];
 app.innerHTML=`<div class="crumb">${hist.length?`<a href="#" id="back">‹ Terug</a>`:`<a href="#/">‹ Start</a>`}<span class="chip">Snelkeuze</span></div>
 <div class="q">${esc(n.q)}</div>${n.note?`<div class="alert info">${esc(n.note)}</div>`:""}
 <div class="opts">${n.o.map((o,i)=>`<button class="opt" data-i="${i}"><span style="flex:1">${esc(o.t)}${o.s?`<small>${esc(o.s)}</small>`:""}</span><span class="chev" aria-hidden="true">›</span></button>`).join("")}</div>
 ${n.tool?`<div class="cta"><a class="btn" href="${n.tool[0]}">${esc(n.tool[1])}</a></div>`:""}`;
 $$(".opt").forEach(b=>b.onclick=()=>{const o=n.o[+b.dataset.i];if(o.z){location.hash="#/zaak/"+o.z}else vWizard(o.n,[...hist,node])});

/* ---------- tools ---------- */
function vTools(sub){
 if(sub==="rijverbod")return tRijverbod();
 if(sub==="beginnend")return tBeginnend();
 if(sub==="snelheid")return tSnelheid();
 if(sub==="rijbewijs"){app.innerHTML=`<div class="crumb"><a href="#/tools">‹ Hulpmiddelen</a></div><h1>Rijbewijs invoeren in BVH</h1>${rbHtml()}`;return}
 app.innerHTML=`<h1>Hulpmiddelen</h1><div class="tools">
 <a href="#/tools/rijverbod"><b>Rijverbod berekenen</b><small>µg/l → uren + eindtijd</small></a>
 <a href="#/tools/beginnend"><b>Beginnend bestuurder?</b><small>5 of 7 jaar + juiste code</small></a>
 <a href="#/tools/snelheid"><b>Snelcheck</b><small>Gedragsregel of bord A1</small></a>
 <a href="#/tools/rijbewijs"><b>Rijbewijs invoeren</b><small>Voorbeeld BVH-scherm</small></a></div>`;
}
const hrs=(x,begin)=>{const r=RV.find(r=>x>=r[1]&&x<=r[2]);if(!r)return x>1780?{over:1}:{none:1};if(begin)return{h:r[0],r:r};const h=r[0]-2;return h>=1?{h,r}:{none:1}};
function rvTable(sel,begin){return `<div class="tw" style="max-height:340px;overflow:auto"><table><thead><tr><th class="n">Uren</th><th>µg/l ademlucht</th></tr></thead><tbody>${RV.map(r=>{const h=begin?r[0]:r[0]-2;if(h<1)return"";return `<tr class="${sel&&sel[0]===r[0]?"hl":""}"><td class="n">${h} uur</td><td>${r[1]} – ${r[2]}</td></tr>`}).join("")}</tbody></table></div>`}
function tRijverbod(){
 const now=new Date(),pad=n=>String(n).padStart(2,"0");
 const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
 app.innerHTML=`<div class="crumb"><a href="#/tools">‹ Hulpmiddelen</a></div><h1>Rijverbod berekenen</h1><p class="lead">Rijverbod art. 8 WvW 1994: duur en eindtijd voor het formulier. Tabelwaarden uit het stappenplan.</p>
 <div class="card"><label style="margin-top:0">Situatie</label>
 <div class="seg" id="sit"><label><input type="radio" name="s" value="adem" checked><span>Ademanalyse-uitslag</span></label><label><input type="radio" name="s" value="wadem"><span>Weigeren ademanalyse</span></label><label><input type="radio" name="s" value="wbloed"><span>Weigeren bloedonderzoek</span></label><label><input type="radio" name="s" value="drugs"><span>Drugs/geneesmiddelen</span></label></div>
 <div id="ad"><label for="v">Uitslag (µg per liter ademlucht)</label><input id="v" type="number" inputmode="numeric" min="0" max="3000" placeholder="bijv. 640">
 <label>Soort bestuurder</label><div class="seg"><label><input type="radio" name="b" value="e" checked><span>Ervaren (≥ 5 jr)</span></label><label><input type="radio" name="b" value="b"><span>Beginnend (&lt; 5 jr)</span></label></div></div>
 <div class="row2"><div><label for="dd">Datum begin rijverbod</label><input id="dd" type="date" value="${ymd(now)}"></div><div><label for="tm">Begintijd</label><input id="tm" type="time" value="${hm(now)}"></div></div>
 <div class="cta"><button class="btn" id="nu" type="button">Begintijd = nu</button></div>
 <div id="out"></div></div>
 <div id="tbw"><h2>Volledige tabel</h2><div id="tb"></div></div>
 <p class="lead" style="font-size:13px;margin-top:10px">Rekenhulp: controleer de uitkomst op het formulier. In de bron overlappen de tabelranden bij 1130 (16 en 17 uur); hier geldt 1130 = 16 uur. Weigeren en drugs: vast 24 uur.</p>`;
 let timer;
 const fmtD=d=>d.toLocaleDateString("nl-NL",{weekday:"short",day:"numeric",month:"long"})+" "+hm(d);
 const left=e=>{const ms=e-new Date();if(ms<=0)return`<span class="chip ok">Rijverbod is verstreken</span>`;const m=Math.ceil(ms/60000);return`<span class="chip warn">Nog ${Math.floor(m/60)} u ${m%60} min</span>`};
 const go=()=>{clearInterval(timer);const sit=$('input[name=s]:checked').value,begin=$('input[name=b]:checked').value==="b",out=$("#out");
  $("#ad").style.display=sit==="adem"?"block":"none";$("#tbw").style.display=sit==="adem"?"block":"none";
  let H,inv=true,tag,zk;
  if(sit==="adem"){$("#tb").innerHTML=rvTable(null,begin);const x=parseInt($("#v").value,10);if(isNaN(x)){out.innerHTML="";return}
   const r=hrs(x,begin);
   if(r.over){out.innerHTML=`<div class="result red"><b>Boven de tabel (1780 µg/l)</b><br>Raadpleeg het formulier.</div>`;return}
   if(r.none){out.innerHTML=`<div class="result"><b>Onder de tabelwaarde</b><br>${begin?"Beginnend: de tabel start bij 90 µg/l.":"Ervaren: de tabel start bij 220 µg/l (1 uur)."} Geen rijverbod uit deze tabel.</div>`;return}
   H=r.h;inv=begin?x>350:x>570;tag=`${x} µg/l, ${begin?"beginnend":"ervaren"} bestuurder`;zk=begin?"alcohol-beginnend":"alcohol-gevorderd";$("#tb").innerHTML=rvTable(r.r,begin)}
  else{H=24;tag={wadem:"Weigeren ademanalyse",wbloed:"Weigeren bloedonderzoek",drugs:"Drugs/geneesmiddelen"}[sit];zk={wadem:"weigeren-adem",wbloed:"weigeren-bloed",drugs:"drugs"}[sit]}
  const dv=$("#dd").value,tv=$("#tm").value;if(!dv||!tv){out.innerHTML="";return}
  const [Y,M,D]=dv.split("-").map(Number),[h,mi]=tv.split(":").map(Number);
  const st=new Date(Y,M-1,D,h,mi,0,0),e=new Date(st.getTime()+H*3600000);
  const txt=`Rijverbod ${H} uur (art. 8 WvW 1994): van ${fmtD(st)} tot ${fmtD(e)} (${tag}).`;
  out.innerHTML=`<div class="result ${inv?"red":"ok"}"><div class="v">${H} uur rijverbod</div>
  <div style="margin-top:6px;font-size:16px">Van <b>${fmtD(st)}</b><br>tot <b>${fmtD(e)}</b></div>
  <div class="chips" id="lf">${left(e)}</div>
  ${sit==="adem"?`<div class="chips"><span class="chip ${inv?"red":"ok"}">${inv?"Boven invorderingsgrens: rijbewijs invorderen":"Onder invorderingsgrens"}</span><span class="chip">${begin?">350":">570"} µg/l = invorderen</span></div>`:`<div class="chips"><span class="chip red">Vast 24 uur</span></div>`}
  <div class="cta"><button class="btn pri" id="cp" type="button">Kopieer tekst voor formulier</button><a class="btn" href="#/zaak/${zk}">Naar stappenplan ›</a></div></div>`;
  $("#cp").onclick=()=>copy(txt,"Tekst gekopieerd");
  timer=setInterval(()=>{const l=$("#lf");if(!l){clearInterval(timer);return}l.innerHTML=left(e)},30000)};
 $("#nu").onclick=()=>{const n=new Date();$("#dd").value=ymd(n);$("#tm").value=hm(n);go()};
 $$("#v,#tm,#dd").forEach(i=>i.oninput=go);$$('input[type=radio]').forEach(i=>i.onchange=go);go();
}

function tBeginnend(){
 app.innerHTML=`<div class="crumb"><a href="#/tools">‹ Hulpmiddelen</a></div><h1>Beginnend bestuurder?</h1><p class="lead">5 of 7 jaar? Volgens het stappenplan, afhankelijk van het eerste rijbewijs.</p>
 <div class="card"><label style="margin-top:0">Eerste rijbewijs was…</label><div class="seg"><label><input type="radio" name="t" value="B" checked><span>B (auto)</span></label><label><input type="radio" name="t" value="AMT"><span>AM of T (bromfiets/trekker)</span></label></div>
 <div class="row2"><div><label for="gd">Geboortedatum</label><input id="gd" type="date"></div><div><label for="d1">Datum eerste afgifte (oudste)</label><input id="d1" type="date"></div></div>
 <div id="bwrap" style="display:none"><label for="db2">Datum afgifte rijbewijs B (leeg = geen B)</label><input id="db2" type="date"></div>
 <label for="pd">Peildatum (datum overtreding)</label><input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}">
 <div id="out"></div></div>
 <h2>Regels uit het stappenplan</h2><div class="card" style="font-size:15px">
 • Eerste rijbewijs B → <b>5 jaar</b> beginnend vanaf afgifte B.<br>• Eerste rijbewijs AM of T vóór je 18e → <b>7 jaar</b>.<br>• Haal je op 17-jarige leeftijd óók B → <b>5 jaar</b>, vanaf afgifte B.<br>• AM/T vóór je 18e en B op of ná je 18e → <b>7 jaar</b>, vanaf afgifte AM/T.</div>`;
 const age=(g,d)=>{let a=d.getFullYear()-g.getFullYear();const m=d.getMonth()-g.getMonth();if(m<0||(m===0&&d.getDate()<g.getDate()))a--;return a};
 const addY=(d,n)=>{const x=new Date(d);x.setFullYear(x.getFullYear()+n);return x};
 const fmt=d=>d.toLocaleDateString("nl-NL",{day:"numeric",month:"long",year:"numeric"});
 const go=()=>{const t=$('input[name=t]:checked').value;$("#bwrap").style.display=t==="AMT"?"block":"none";const out=$("#out");
  const g=$("#gd").valueAsDate,d1=$("#d1").valueAsDate,pd=$("#pd").valueAsDate,db=$("#db2").valueAsDate;
  if(!g||!d1||!pd){out.innerHTML="";return}
  let yrs,start,why;const a1=age(g,d1);
  if(t==="B"){yrs=5;start=d1;why="Eerste rijbewijs is B."}
  else if(a1<18){if(db&&age(g,db)<18){yrs=5;start=db;why="AM/T én B vóór het 18e jaar: 5 jaar vanaf afgifte B."}else{yrs=7;start=d1;why="AM/T vóór het 18e jaar, B op/na 18e of geen B: 7 jaar vanaf afgifte AM/T."}}
  else{out.innerHTML=`<div class="result"><b>Niet beschreven in het stappenplan</b><br>Eerste rijbewijs AM/T op of na het 18e jaar. Toets aan art. 8 lid 3 WvW94 (<a href="${wet(WVW,8)}" target="_blank" rel="noopener">wetstekst ↗</a>).</div>`;return}
  const end=addY(start,yrs),beg=pd<end;const c=zaak("alcohol-beginnend").codes,c2=zaak("bloed-beginnend").codes;const ix=yrs===5?0:1;
  out.innerHTML=`<div class="result ${beg?"red":"ok"}"><div class="v">${beg?`Beginnend bestuurder (${yrs} jaar)`:"Ervaren bestuurder"}</div>
  <div style="margin-top:4px">${why}<br>Beginnend tot <b>${fmt(end)}</b>. Peildatum: ${fmt(pd)}.</div>
  ${beg?`<div class="chips"><span class="chip red">Ademanalyse 8/3/A: ${c[ix].c}</span><span class="chip red">Bloed 8/3/B: ${c2[ix].c}</span></div><div class="cta"><a class="btn" href="#/zaak/alcohol-beginnend">Stappenplan adem ›</a><a class="btn" href="#/zaak/bloed-beginnend">Stappenplan bloed ›</a></div>`:`<div class="cta"><a class="btn" href="#/zaak/alcohol-gevorderd">Stappenplan adem ›</a><a class="btn" href="#/zaak/bloed-gevorderd">Stappenplan bloed ›</a></div>`}</div>`};
 $$("#gd,#d1,#db2,#pd").forEach(i=>i.oninput=go);$$('input[name=t]').forEach(i=>i.onchange=go);go();
}

function tSnelheid(){
 app.innerHTML=`<div class="crumb"><a href="#/tools">‹ Hulpmiddelen</a></div><h1>Snelcheck</h1><p class="lead">Gedragsregel of bord A1? Dat bepaalt het artikel in BVH.</p>
 <div class="card"><label style="margin-top:0">Waar reed de verdachte?</label>
 <div class="seg"><label><input type="radio" name="w" value="50" checked><span>Binnen bebouwde kom</span></label><label><input type="radio" name="w" value="80"><span>Buiten bebouwde kom</span></label><label><input type="radio" name="w" value="100"><span>Autoweg</span></label><label><input type="radio" name="w" value="130"><span>Snelweg</span></label></div>
 <label>Stond er een bord A1 (afwijkende maximumsnelheid)?</label><div class="seg"><label><input type="radio" name="a" value="n" checked><span>Nee</span></label><label><input type="radio" name="a" value="j"><span>Ja, bord A1</span></label></div>
 <div id="out"></div></div>
 <div class="alert info" style="margin-top:12px"><b>Gedragsregels (kort)</b>50 km/h binnen de bebouwde kom, 80 buiten de bebouwde kom, 130 op snelwegen, 100 op autowegen. Wordt daarvan afgeweken met bord A1 (bijv. 100 op de snelweg), dan maak je het pv op voor bord A1.</div>
 <div class="cta"><a class="btn pri" href="#/zaak/snelheid">Stappenplan snelheid ›</a></div>`;
 const go=()=>{const w=$('input[name=w]:checked').value,a=$('input[name=a]:checked').value==="j";
  $("#out").innerHTML=a?`<div class="result red"><div class="v">62/A1 RVV 90</div><div style="margin-top:4px">Bord A1 van toepassing: leg het overtreden bord A1 ten laste (de bordsnelheid, niet de gedragsregel).</div></div>`:`<div class="result"><div class="v">20/A RVV 90</div><div style="margin-top:4px">Gedragsregel overtreden: maximaal <b>${w} km/h</b> op dit wegtype. Leg 20/A ten laste.</div></div>`};
 $$('input').forEach(i=>i.onchange=go);go();
}

 <div class="bvh">
  <span class="l">Categorie/Soort</span><span class="f">DK22 · Identiteitspapieren / Rijbewijs</span>
  <span class="l">Registratie nr.</span><span class="f h">987654321</span><span class="note">↑ het rijbewijsnummer</span>
  <span class="l">Model-type</span><span class="f h">BAM</span><span class="note">↑ alle categorieën op het rijbewijs</span>
  <span class="l">Datum afgifte</span><span class="f h">01/05/2019</span>
  <span class="l">Datum 1e afgifte</span><span class="f h">01/06/1986</span><span class="note">↑ geldt voor elke categorie: voer de OUDSTE datum in</span>

 else if(m==="rv"){t="Rijverbodtabel";b=`<p class="lead">Beginnend bestuurder < 5 jaar rijbewijs, ervaren ≥ 5 jaar. <a href="#/tools/rijverbod" id="goRv">Open de rekenhulp ›</a></p><div class="tw" style="max-height:55vh;overflow:auto"><table><thead><tr><th>Beginnend</th><th>µg/l</th><th>Ervaren</th></tr></thead><tbody>${RV.map(r=>`<tr><td>${r[0]} uur</td><td>${r[1]} – ${r[2]}</td><td>${r[0]-2>=1?r[0]-2+" uur":"—"}</td></tr>`).join("")}</tbody></table></div><p class="lead" style="font-size:13px">Weigeren of drugs: rijverbod 24 uur.</p>`}
 else if(m==="contact"){t="Wie mail ik?";b=`<p>Mail: <b>${esc(contact())}</b></p><p class="lead">Stel het contact in onder <a href="#/afspraken" id="goAf">Afspraken</a>. De namen in het brondocument horen bij een ander team en zijn niet overgenomen.</p>`}
 else if(m==="bvi"){t="BVI-IB controleren";b=`<ol style="padding-left:20px;margin:0"><li>Bevraag de persoon in BVI-IB.</li><li>Ga naar het kopje <b>RDW</b>.</li><li>Scroll naar <b>verblijfplaats document</b>.</li><li>Staat daar rood <b style="color:var(--red)">‘Niet ingeleverd’</b>? Neem het rijbewijs in.</li></ol>`}
 $("#dt").textContent=t;$("#db").innerHTML=b;if(!D.open)D.showModal();
 $$("#db a").forEach(a=>a.addEventListener("click",()=>D.close()));
}
$("#dc").onclick=()=>$("#dlg").close();
$("#dlg").addEventListener("click",e=>{if(e.target.id==="dlg")e.target.close()});

/* ---------- delen ---------- */

 if(navigator.share){try{await navigator.share({title:(title||"Verkeerswijzer")+" · BT Amersfoort",text:"Verkeerswijzer basisteam Amersfoort",url});return}catch(e){if(e&&e.name==="AbortError")return}}

}
$("#share").onclick=()=>shareIt();

/* ---------- thema ---------- */
(function(){const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;
 $("#theme").onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;store.set("theme",n)}})();

/* ---------- router ---------- */
function route(){
 const h=location.hash||"#/";const p=h.replace(/^#\/?/,"").split("/");
 renderNav(h);$("#q").value="";$("#qx").style.display="none";
 if(!p[0])vHome();else if(p[0]==="zaak")vZaak(p[1]);else if(p[0]==="zaken")vZaken();else if(p[0]==="wizard")vWizard();else if(p[0]==="tools")vTools(p[1]);else if(p[0]==="codes")vCodes();else if(p[0]==="afspraken")vAfspraken();else vHome();
 scrollTo(0,0);setHH();
}
function setHH(){document.documentElement.style.setProperty("--hh",$("#hd").offsetHeight+"px")}
addEventListener("resize",setHH);
addEventListener("hashchange",route);

/* zoekresultaten */
const q=$("#q");
q.addEventListener("input",()=>{
 const v=q.value.trim();$("#qx").style.display=v?"block":"none";
 if(!v){route();return}
 const r=zoek(v);
 app.innerHTML=`<h1>${r.length} resultaat${r.length===1?"":"en"}</h1>`+(r.length?r.map(z=>`<a class="hit" href="#/zaak/${z.id}"><span class="k">${z.klasse}</span><span><b>${hl(z.kort,v)}</b><small>art. ${hl(z.laste,v)} · ${z.codes.map(c=>hl(c.c,v)).join(" · ")||"geen code"}</small></span></a>`).join(""):`<div class="card">Niets gevonden voor “${esc(v)}”. Probeer een artikel (8/2/A), klasse (D21), code (12262) of woord (weigeren, geschorst, snelheid).</div>`);
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const r=zoek(q.value);if(r.length===1){q.value="";location.hash="#/zaak/"+r[0].id}q.blur()}});
$("#qx").onclick=()=>{q.value="";q.focus();route()};
document.addEventListener("click",e=>{const c=e.target.closest("[data-copy]");if(c){e.preventDefault();e.stopPropagation();copy(c.dataset.copy);if(c.tagName==="BUTTON")c.classList.add("done")}});

$("#foot").innerHTML=`<div>Bron: ${esc(BRON)}.<br>Hulpmiddel bij de afhandeling; geen vervanging van wet, werkinstructie of eigen beoordeling. Controleer altijd de actuele regelgeving. Gegevens van deze app staan alleen op jouw apparaat.</div>`;
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
route();
</script>
